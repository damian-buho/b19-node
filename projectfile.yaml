$schema: https://projectfile.org/schema/v1.json
identity:
  created: "2026-06-01"
  name: node
  summary:
    en: Community-maintained distribution of Node.js based on B19/Ubuntu
    es: Distribución de Node.js mantenida por la comunidad, basada en B19/Ubuntu
    uk: Дистрибуція Node.js з підтримкою спільноти на основі B19/Ubuntu
  title: B19 / Node
  description:
    en: Community-maintained distribution of Node.js built on B19/Ubuntu. This repository holds only the packaging — Dockerfile, build scripts, and configuration, all MIT-licensed; the upstream Node.js is fetched at build time and retains its own licensing.
    es: Distribución de Node.js mantenida por la comunidad, construida sobre B19/Ubuntu. Este repositorio contiene únicamente el empaquetado — Dockerfile, scripts de compilación y configuración, todo con licencia MIT; el código original de Node.js se obtiene en tiempo de compilación y conserva su propia licencia.
    uk: Дистрибуція Node.js з підтримкою спільноти, зібрана на основі B19/Ubuntu. Цей репозиторій містить лише пакування — Dockerfile, скрипти збирання та конфігурацію, усе під ліцензією MIT; вихідний код Node.js отримують під час збирання, і він зберігає власну ліцензію.
  version: 0.10.1
  released: "2026-10-29"
  visibility: public
includes:
  - .makefile/b19/ci.yaml
  - .makefile/b19/images/gcc.yaml
  - .makefile/b19/images/python.yaml
  - .makefile/b19/images/ubuntu.yaml
  - .makefile/b19/traits/image/attested.yaml
  - .makefile/b19/traits/image/release.yaml
  - .makefile/b19/traits/image/signed.yaml
  - .makefile/container/traits/image/variant.yaml
  - https://kiota.ch/b19/metadata/raw/branch/main/include.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/forge/github.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/include.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/registry/dockerhub.yaml
keywords:
  - node
  - nodejs
  - javascript
  - runtime
  - docker
kind: SoftwareSourceCode
links:
  - label:
      en: B19 / Node on GitHub
      es: B19 / Node en GitHub
      uk: B19 / Node на GitHub
    priority: 80
    tags:
      - public
      - badges
      - badges-github
    type: source-code
    url: https://github.com/damian-buho/b19-node
  - label:
      en: Issues on GitHub
      es: Incidencias en GitHub
      uk: Задачі на GitHub
    priority: 80
    tags:
      - support
    type: bugs
    url: https://github.com/damian-buho/b19-node/issues
  - label:
      en: B19 / Node on kiota.ch
      es: B19 / Node en kiota.ch
      uk: B19 / Node на kiota.ch
    preferred: true
    priority: 10
    type: source-code
    url: https://kiota.ch/b19/node
  - label:
      en: Packages on GHCR
      es: Paquetes en GHCR
      uk: Пакунки на GHCR
    type: package-registry
    url: https://github.com/damian-buho/b19-node/pkgs/container/b19%2Fnode
  - label:
      en: Packages on Docker Hub
      es: Paquetes en Docker Hub
      uk: Пакунки на Docker Hub
    type: package-registry
    url: https://hub.docker.com/r/damianbuho/b19-node
org:
  b19:
    scaffold:
      root-stage: root
  projectfile:
    architecture:
      - amd64
      - arm64
    build:
      args:
        B19_NODE_SERIES: 24
      env:
        - npm_config_registry
    image:
      series: "n{B19_NODE_SERIES}"
      tag: ${series}
      variant:
        parts:
          - series
    ci:
      matrix:
        axes:
          B19_NODE_SERIES:
            - 24
            - 26
      nodes:
        image-is-built:
          # V8 compilation is memory-hungry enough that two series at once OOMs the
          # pipeline runner. max-parallel cannot express that on Forgejo (it dispatches
          # matrix cells with no regard for the cap), so chain the series into one job
          # each: an edge is the only ordering both forges honour.
          serialise: B19_NODE_SERIES
    conventions:
      fragments:
        parents:
          - ../ubuntu
    status: maintained
repositories:
  - role: mirror
    type: git
    url: git@github.com:damian-buho/b19-node.git
  - branch: main
    role: origin
    type: git
    url: ssh://git@kiota.ch/b19/node.git
technologies:
  - javascript
  - node
upstream:
  - authors: The Node.js contributors
    license: MIT
    name: Node.js
    url: https://nodejs.org
