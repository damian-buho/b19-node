# SPDX-License-Identifier: MIT
$schema: https://projectfile.org/schema/v1.json
identity:
  created: "2026-06-01"
  name: node
  summary: Node.js runtime compiled from source
  title: B19/Node
includes:
  - .makefile/b19/ci.yaml
  - .makefile/b19/images/gcc.yaml
  - .makefile/b19/images/python.yaml
  - .makefile/b19/images/ubuntu.yaml
  - .makefile/b19/vulnerabilities/npm-bundled.yaml
  - https://kiota.ch/b19/metadata/raw/branch/main/include.yaml
  - https://kiota.ch/damian-buho/metadata/raw/branch/main/include.yaml
kind: SoftwareSourceCode
links:
  - label: B19/Node on Codeberg
    type: source-code
    url: https://codeberg.org/b19/node
  - label: B19/Node on GitHub
    type: source-code
    url: https://github.com/damian-buho/b19-node
  - label: B19/Node on kiota.ch
    type: source-code
    url: https://kiota.ch/b19/node
  - label: Issues on Codeberg
    type: bugs
    url: https://codeberg.org/b19/node/issues
  - label: Issues on GitHub
    type: bugs
    url: https://github.com/damian-buho/b19-node/issues
  - label: Packages on npm
    type: package-registry
    url: https://www.npmjs.com/package/node
org:
  b19:
    scaffold:
      root-stage: root
  projectfile:
    build:
      args:
        B19_NODE_SERIES: 24
      env:
        - npm_config_registry
    ci:
      image: b19/node-{B19_NODE_SERIES}
      matrix:
        axes:
          B19_NODE_SERIES:
            - 24
            - 26
    conventions:
      fragments:
        parents:
          - ../ubuntu
    status: maintained
    vulnerabilities:
      suppress:
        - id: CVE-2026-12151
          reason: undici locked to pnpm
repositories:
  - issues: true
    role: mirror
    type: git
    url: ssh://git@codeberg.org/b19/node.git
  - role: mirror
    type: git
    url: git@github.com:damian-buho/b19-node.git
  - role: origin
    type: git
    url: ssh://git@kiota.ch/b19/node.git
